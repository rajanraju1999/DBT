version: 2

models:
  - name: customer  # <-- your model name (same as customer.sql)
    description: "Staging model for the customer table from tpch_sf1 source"
    config:
      materialized: view

    columns:
      - name: customer_key
        description: "Primary key for the customer"
        tests:
          - not_null
          - unique

      - name: customer_name
        description: "Name of the customer"

      - name: customer_address
        description: "Address of the customer"

      - name: nation_key
        description: "Foreign key to the nation dimension"

      - name: customer_phone
        description: "Customer phone number"

      - name: account_balance
        description: "Customer account balance"

      - name: market_segment
        description: "Market segment the customer belongs to"

      - name: customer_comment
        description: "Free-text comment about the customer"
